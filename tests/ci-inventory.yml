---
# CI inventory: runs on the GitHub Actions Ubuntu runner itself.
# k3s is installed directly on the runner (no containers/VMs).
#
# The Cozystack-tuned k3s flags live in this inventory's `vars:` block
# (inventory scope), NOT in a playbook-adjacent group_vars/all.yml. This is
# required for correctness, not convenience: the inventory is external to
# examples/ubuntu/, so examples/ubuntu/group_vars/all.yml would load only as
# playbook-adjacent group_vars, which are scoped to the top-level playbook
# and are NOT applied to the `import_playbook: k3s.orchestration.site` that
# lives in the collection directory — the k3s flags would silently vanish and
# k3s would come up with upstream defaults. Inventory vars are global across
# every play, so they reach the imported k3s role. The k3s_cluster group is
# created by the group_by task in prepare-ubuntu.yml on the chained
# site.yml path.
cluster:
  children:
    server:
      hosts:
        localhost:
          ansible_connection: local
    agent:
      hosts: {}

  vars:
    ansible_user: runner

    # k3s configuration
    # renovate: datasource=github-releases depName=k3s-io/k3s
    k3s_version: v1.36.2+k3s1
    token: "ci-test-token"
    api_endpoint: "127.0.0.1"
    cluster_context: ci-test

    # Cozystack-tuned k3s configuration consumed by k3s.orchestration. Kept in
    # sync with examples/*/inventory.yml (see hack/check-examples-k3s.sh). No
    # cozystack_k3s_extra_args here — CI needs no extra --tls-san.
    cozystack_k3s_server_args: >-
      --disable=traefik
      --disable=servicelb
      --disable=local-storage
      --disable=metrics-server
      --disable-network-policy
      --disable-kube-proxy
      --flannel-backend=none
      --cluster-domain=cozy.local
      --kubelet-arg=max-pods=220
    cozystack_k3s_server_config_yaml: |
      cluster-cidr: 10.42.0.0/16
      service-cidr: 10.43.0.0/16
    extra_server_args: >-
      {{ cozystack_k3s_server_args }}
      {{ cozystack_k3s_extra_args | default("") }}
    server_config_yaml: "{{ cozystack_k3s_server_config_yaml }}"

    # Cozystack configuration
    cozystack_api_server_host: "127.0.0.1"
    cozystack_master_nodes: "127.0.0.1"
    cozystack_root_host: "cozy.ci-test.local"
    cozystack_platform_variant: "isp-full-generic"

    # CI-specific: no iptables flush needed
    cozystack_flush_iptables: false
