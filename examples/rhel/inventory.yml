---
cluster:
  children:
    server:
      hosts:
        # Internal IP as host key, public IP as ansible_host
        10.0.0.10:
          ansible_host: 203.0.113.10
    agent:
      hosts:
        10.0.0.11:
          ansible_host: 203.0.113.11
        10.0.0.12:
          ansible_host: 203.0.113.12

  vars:
    ansible_port: 22
    ansible_user: cloud-user

    # k3s configuration (used by k3s.orchestration)
    # renovate: datasource=github-releases depName=k3s-io/k3s
    k3s_version: v1.36.4+k3s1
    token: "CHANGE_ME"
    api_endpoint: "10.0.0.10"
    cluster_context: my-cluster

    # Cozystack configuration (REQUIRED)
    cozystack_api_server_host: "10.0.0.10"

    # Platform Package configuration
    cozystack_root_host: "cozy.example.com"
    cozystack_platform_variant: "isp-full-generic"

    # External IPs for ingress-nginx (required on cloud VMs without native LB)
    # cozystack_external_ips:
    #   - "203.0.113.10"

    # Enable ingress on root tenant (creates IngressClass + controller)
    # cozystack_tenant_root_ingress: true

    # Cozystack-tuned k3s configuration consumed by the k3s.orchestration
    # collection. Declared at INVENTORY scope on purpose. A playbook-adjacent
    # group_vars/all.yml does NOT work here: playbook group_vars are scoped to
    # the top-level playbook's directory and are not loaded for the
    # `import_playbook: k3s.orchestration.site` (which lives in the collection
    # directory), nor for a standalone k3s.orchestration.site run whose
    # inventory sits outside examples/<distro>/. Inventory vars are global
    # across every play and every separate `ansible-playbook` process, so the
    # tuned flags reach the k3s role on the chained site.yml path, the split
    # prepare + k3s.orchestration.site path, and with an external inventory
    # alike. Without them k3s silently comes up with upstream defaults
    # (traefik, servicelb, flannel, kube-proxy, cluster.local, ...).
    cozystack_k3s_server_args: >-
      --disable=traefik
      --disable=servicelb
      --disable=local-storage
      --disable=metrics-server
      --disable-network-policy
      --disable-kube-proxy
      --flannel-backend=none
      --cluster-domain=cozy.local
      --kubelet-arg=max-pods=220
    cozystack_k3s_server_config_yaml: |
      cluster-cidr: 10.42.0.0/16
      service-cidr: 10.43.0.0/16
    # Operator-supplied extra flags, appended to extra_server_args below
    # (e.g. additional --tls-san entries). Leave empty to add nothing.
    cozystack_k3s_extra_args: "--tls-san=203.0.113.10"
    # Composed values consumed directly by k3s.orchestration.
    extra_server_args: >-
      {{ cozystack_k3s_server_args }}
      {{ cozystack_k3s_extra_args | default("") }}
    server_config_yaml: "{{ cozystack_k3s_server_config_yaml }}"

    # OCI: enable iptables flush (cloud images may block non-SSH traffic)
    # cozystack_flush_iptables: true

# Static k3s_cluster group required by the k3s.orchestration collection.
# Declared statically (not only via the group_by fallback in
# prepare-rhel.yml) so it exists when k3s.orchestration.site runs as a
# standalone invocation, not just when chained through site.yml.
k3s_cluster:
  children:
    server:
    agent:
