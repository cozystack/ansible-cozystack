---
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check version invariants
        run: ./hack/check-versions.sh

      - name: Self-test version-invariant check
        run: ./hack/test-check-versions.sh

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install ansible-core ansible-lint

      - name: Build and install collection
        run: |
          ansible-galaxy collection build
          ansible-galaxy collection install cozystack-installer-*.tar.gz --force

      - name: Install collection dependencies
        run: ansible-galaxy collection install --requirements-file requirements.yml

      - name: Run ansible-lint
        run: ansible-lint

      - name: Syntax check Ubuntu example
        run: ansible-playbook examples/ubuntu/prepare-ubuntu.yml --syntax-check

      - name: Syntax check Ubuntu sudo workaround
        run: ansible-playbook examples/ubuntu/prepare-sudo.yml --syntax-check

      - name: Syntax check SUSE example
        run: ansible-playbook examples/suse/prepare-suse.yml --syntax-check

      - name: Syntax check RHEL example
        run: ansible-playbook examples/rhel/prepare-rhel.yml --syntax-check

      - name: Check examples split-invocation contract
        run: ./hack/check-examples-k3s.sh

      - name: Self-test examples split-invocation check
        run: ./hack/test-check-examples-k3s.sh

  sanity:
    name: Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ansible_collections/cozystack/installer

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install ansible-core and unit test dependencies
        run: pip install ansible-core pytest pytest-xdist pytest-forked pytest-mock

      - name: Run sanity tests
        working-directory: ansible_collections/cozystack/installer
        run: ansible-test sanity --color

      - name: Run unit tests
        working-directory: ansible_collections/cozystack/installer
        run: ansible-test units --color --python 3.14

  master-nodes:
    name: Multi-master MASTER_NODES
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Build and install collection
        run: |
          ansible-galaxy collection build
          ansible-galaxy collection install cozystack-installer-*.tar.gz --force

      - name: Test auto-detection from server group (3 nodes)
        run: >-
          ansible-playbook tests/test-master-nodes.yml
          --inventory tests/test-multi-master-inventory.yml

      - name: Test single-node auto-detection (IP host key)
        run: >-
          ansible-playbook tests/test-master-nodes.yml
          --inventory tests/test-single-master-inventory.yml

      - name: Test single-node explicit override (CI inventory)
        run: >-
          ansible-playbook tests/test-master-nodes.yml
          --inventory tests/ci-inventory.yml

      - name: Test IPv6 host keys are accepted
        run: >-
          ansible-playbook tests/test-master-nodes.yml
          --inventory tests/test-ipv6-inventory.yml

      - name: Test hostname host keys are rejected
        run: |
          set +e
          output="$(ansible-playbook tests/test-master-nodes.yml \
            --inventory tests/test-hostname-inventory.yml 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "ERROR: Expected failure for hostname host keys, but playbook succeeded"
            exit 1
          fi

          if ! grep -q "not a valid IP address in MASTER_NODES" <<< "$output"; then
            echo "ERROR: Playbook failed, but not due to hostname/IP validation"
            echo "$output"
            exit 1
          fi

          echo "OK: Hostname host keys correctly rejected"

  external-ips:
    name: External IPs validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Build and install collection
        run: |
          ansible-galaxy collection build
          ansible-galaxy collection install cozystack-installer-*.tar.gz --force

      - name: Test external IPs rendering
        run: >-
          ansible-playbook tests/test-external-ips.yml
          --inventory tests/test-external-ips-inventory.yml

      - name: Test invalid IPs are rejected
        run: |
          set +e
          output="$(ansible-playbook tests/test-external-ips.yml \
            --inventory tests/test-invalid-ips-inventory.yml 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "ERROR: Expected failure for invalid IPs, but playbook succeeded"
            exit 1
          fi

          if ! grep -q "not a valid IP address in cozystack_external_ips" <<< "$output"; then
            echo "ERROR: Playbook failed, but not due to IP validation"
            echo "$output"
            exit 1
          fi

          echo "OK: Invalid IPs correctly rejected"

  lvm-global-filter:
    name: LVM global_filter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install lvm2 (provides lvmconfig)
        run: sudo apt-get update && sudo apt-get install --yes lvm2

      - name: Test host LVM global_filter rendering and effectiveness
        run: ansible-playbook tests/test-lvm-global-filter.yml

  nvidia-vgpu-host:
    name: NVIDIA vGPU host restore unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Build and install collection
        run: |
          ansible-galaxy collection build
          ansible-galaxy collection install cozystack-installer-*.tar.gz --force

      # The runner has no NVIDIA GPU, which is the point: this asserts
      # the artifacts render correctly, the unit is skipped by its
      # condition rather than failing, and every path the script can
      # take on hardware it is not meant for exits the way it should.
      # shellcheck and systemd-analyze both run inside the playbook.
      - name: Test the vGPU host restore unit and its no-op paths
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook
          tests/test-nvidia-vgpu-host.yml

      - name: Test re-application (second run)
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook
          tests/test-nvidia-vgpu-host.yml

      # The refusal paths above are everything the script does without a
      # GPU. This runs the stages themselves against a fake nvidia-smi,
      # a fake sriov-manage and a fake PCI tree, so the code that writes
      # to hardware is executed rather than only rendered.
      - name: Test the restore stages against a fake GPU
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook
          tests/test-nvidia-vgpu-host-stages.yml

      # Two spellings of one card, or of one virtual function, collapse to
      # a single key at render time and one of the two profiles is
      # silently discarded. The role refuses rather than pick a winner.
      - name: Test that duplicate device addresses are rejected
        run: |
          set +e
          output="$(sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook \
            tests/test-nvidia-vgpu-host-idempotency.yml \
            --extra-vars '{"cozystack_nvidia_vgpu_devices":[{"address":"0000:41:00.0","sriov":true},{"address":"41:00.0","sriov":true}]}' 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "ERROR: two spellings of one card were accepted"
            exit 1
          fi

          if ! grep -q "names the same GPU more than" <<< "$output"; then
            echo "ERROR: rejected, but not by the duplicate-address check"
            echo "$output" | tail -30
            exit 1
          fi

          echo "OK: duplicate device addresses correctly rejected"

      # A card and a virtual function are different levels and had
      # different rules; the VF check deleted the PCI domain, so two
      # functions on different segments looked like one.
      - name: Test that duplicate virtual-function addresses are rejected
        run: |
          set +e
          output="$(sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook \
            tests/test-nvidia-vgpu-host-idempotency.yml \
            --extra-vars '{"cozystack_nvidia_vgpu_devices":[{"address":"0000:41:00.0","vgpu_profiles":{"0000:41:00.5":1155,"41:00.5":1160}}]}' 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "ERROR: two spellings of one virtual function were accepted"
            exit 1
          fi

          if ! grep -q "names the same virtual function more than" <<< "$output"; then
            echo "ERROR: rejected, but not by the duplicate-VF check"
            echo "$output" | tail -30
            exit 1
          fi

          echo "OK: duplicate virtual-function addresses correctly rejected"

      # The other direction, which is the one that regressed: cards and
      # functions on different PCI segments are distinct and must be
      # accepted, not refused as duplicates.
      - name: Test that a multi-segment configuration is accepted
        run: |
          set -euo pipefail
          devices='{"cozystack_nvidia_vgpu_devices":[
            {"address":"0000:41:00.0","vgpu_profiles":{"0000:41:00.5":1155}},
            {"address":"0001:41:00.0","vgpu_profiles":{"0001:41:00.5":1160}}]}'
          sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook \
            tests/test-nvidia-vgpu-host-idempotency.yml --extra-vars "$devices"
          echo "OK: cards on different PCI segments accepted"

      # Writing 0 to a function's current_vgpu_type does not set a
      # profile, so a profile id of 0 is a configuration error rather
      # than a value to pass through.
      - name: Test that a zero profile id is rejected
        run: |
          set +e
          for v in '{"cozystack_nvidia_vgpu_devices":[{"address":"0000:41:00.0","vgpu_profile":0}]}' \
                   '{"cozystack_nvidia_vgpu_devices":[{"address":"0000:41:00.0","vgpu_profiles":{"0000:41:00.5":0}}]}' \
                   '{"cozystack_nvidia_vgpu_devices":[{"address":"0000:41:00.0","mig":false}]}'; do
            output="$(sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook \
              tests/test-nvidia-vgpu-host-idempotency.yml --extra-vars "$v" 2>&1)"
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "ERROR: accepted $v"
              exit 1
            fi
            if ! grep -qE "Invalid entry in|Invalid per-VF" <<< "$output"; then
              echo "ERROR: rejected for the wrong reason: $v"
              echo "$output" | tail -20
              exit 1
            fi
          done
          set -e
          echo "OK: zero profile ids and entries that ask for nothing are rejected"

      - name: Apply the role on its own
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook
          tests/test-nvidia-vgpu-host-idempotency.yml

      - name: Test idempotency (second run reports no change)
        run: |
          set -euo pipefail
          output="$(sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook \
            tests/test-nvidia-vgpu-host-idempotency.yml)"
          echo "$output"
          if ! grep -q "changed=0" <<< "$output"; then
            echo "ERROR: re-applying the role reported changes"
            exit 1
          fi
          echo "OK: role is idempotent"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Build and install collection
        run: |
          ansible-galaxy collection build
          ansible-galaxy collection install cozystack-installer-*.tar.gz --force

      - name: Install collection dependencies
        run: |
          ansible-galaxy collection install --requirements-file requirements.yml
          ansible-galaxy collection install --requirements-file tests/requirements.yml

      - name: Run full pipeline
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook examples/ubuntu/site.yml
          --inventory tests/ci-inventory.yml

      - name: Verify operator is running
        run: |
          sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
            wait deployment/cozystack-operator \
            --namespace cozy-system \
            --timeout=120s \
            --for=condition=Available

      - name: Verify CRDs are established
        run: |
          sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
            wait crd/packages.cozystack.io \
            --for=condition=Established \
            --timeout=60s

      - name: Verify Platform Package exists
        run: |
          sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
            get package cozystack.cozystack-platform \
            --namespace cozy-system

      - name: Test idempotency (second run)
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook examples/ubuntu/site.yml
          --inventory tests/ci-inventory.yml

      # Namespace adoption regression test. Reproduces the failure
      # mode: chart 1.4.0 expects --create-namespace to create
      # cozy-system on a fresh install, but if the namespace already
      # exists without helm ownership metadata, helm fails with
      #   Namespace "cozy-system" exists and cannot be imported into
      #   the current release: invalid ownership metadata
      # Strip both the helm release storage Secret (so helm forgets
      # the release entirely) and the namespace's helm labels and
      # annotations (so the next install sees an orphan namespace).
      # This simulates a manual `kubectl create ns` or a remnant
      # from a previous failed install.
      - name: Simulate orphan cozy-system namespace
        run: |
          set -eux
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          sudo kubectl --kubeconfig $KUBECONFIG \
            label namespace cozy-system app.kubernetes.io/managed-by-
          sudo kubectl --kubeconfig $KUBECONFIG \
            annotate namespace cozy-system \
              meta.helm.sh/release-name- \
              meta.helm.sh/release-namespace-
          sudo kubectl --kubeconfig $KUBECONFIG \
            delete secret --namespace cozy-system \
              --selector=owner=helm,name=cozy-installer

      - name: Test namespace adoption (re-install over orphan namespace)
        run: >-
          sudo env "PATH=$PATH" "HOME=$HOME" ansible-playbook examples/ubuntu/site.yml
          --inventory tests/ci-inventory.yml

      - name: Verify cozy-system namespace was re-adopted
        run: |
          set -eux
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          managed_by="$(sudo kubectl --kubeconfig $KUBECONFIG \
            get namespace cozy-system \
            --output jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}')"
          release_name="$(sudo kubectl --kubeconfig $KUBECONFIG \
            get namespace cozy-system \
            --output jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}')"
          release_namespace="$(sudo kubectl --kubeconfig $KUBECONFIG \
            get namespace cozy-system \
            --output jsonpath='{.metadata.annotations.meta\.helm\.sh/release-namespace}')"
          if [ "$managed_by" != "Helm" ] \
              || [ "$release_name" != "cozy-installer" ] \
              || [ "$release_namespace" != "cozy-system" ]; then
            echo "ERROR: namespace adoption failed"
            echo "  managed-by label:        '$managed_by' (expected 'Helm')"
            echo "  release-name annot.:     '$release_name' (expected 'cozy-installer')"
            echo "  release-namespace annot.: '$release_namespace' (expected 'cozy-system')"
            exit 1
          fi
          echo "OK: cozy-system namespace adopted into helm release"

      # Foreign-owner refusal: re-stamp cozy-system as owned by a
      # different fake helm release and assert the role fails
      # rather than silently hijacking ownership.
      - name: Stamp cozy-system as owned by a different helm release
        run: |
          set -eux
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          sudo kubectl --kubeconfig $KUBECONFIG \
            annotate namespace cozy-system --overwrite \
              meta.helm.sh/release-name=some-other-release \
              meta.helm.sh/release-namespace=elsewhere

      - name: Test that foreign-owner namespace is NOT overwritten
        run: |
          set +e
          output="$(sudo env "PATH=$PATH" "HOME=$HOME" \
            ansible-playbook examples/ubuntu/site.yml \
            --inventory tests/ci-inventory.yml 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "ERROR: role silently re-adopted a foreign-owned namespace."
            echo "Expected refusal because cozy-system is owned by 'some-other-release'."
            echo "$output" | tail -50
            exit 1
          fi

          if ! grep -q "owned by helm release 'some-other-release'" <<< "$output"; then
            echo "ERROR: role failed but not for the expected reason."
            echo "$output" | tail -50
            exit 1
          fi

          echo "OK: role correctly refused to overwrite foreign helm ownership."

      - name: Restore cozy-system ownership for cleanup
        run: |
          set -eux
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          sudo kubectl --kubeconfig $KUBECONFIG \
            annotate namespace cozy-system --overwrite \
              meta.helm.sh/release-name=cozy-installer \
              meta.helm.sh/release-namespace=cozy-system
